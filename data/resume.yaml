summaries:
  general: >-
    Data and AI engineer with a background in physics and astrophysics and more
    than 20 years of experience across research labs, startups, a multinational,
    and Atlantic Canada's largest health research system. I build data platforms
    and AI tooling for medical imaging, have led product and engineering as a
    startup CTO, and spent my early career integrating and flying NASA balloon
    payloads from New Mexico and Antarctica.
  data-eng: >-
    Data and AI engineer building the data infrastructure behind machine-learning
    research in diagnostic imaging (MRI, CT, ultrasound) at Nova Scotia Health.
    I design ETL pipelines, PHI de-identification tooling, and annotation
    platforms for radiologists, working in Python, Databricks, Docker, and
    MongoDB. Previously CTO of a SaaS startup and test-automation developer at
    BlackBerry.
  ai-training: >-
    Physicist (M.Sc., University of Hawai'i; B.Sc. Astrophysics, Saint Mary's)
    and Python engineer with 20+ years of scientific computing. Thesis research
    on radio detection of ultra-high-energy neutrinos (Askaryan effect, ANITA)
    and numerical stability in stellar evolution codes. Today I build data
    pipelines and AI tooling for medical imaging research.
  space: >-
    Physicist and engineer with hands-on space-science experience: hardware,
    firmware, and RF integration for the NASA ANITA long-duration balloon
    payload, two flight campaigns (Fort Sumner, NM and a three-month McMurdo
    deployment in Antarctica), and payload commanding over TDRSS. Top-100
    candidate in the Canadian Space Agency's astronaut recruitment campaign.
    Since then: startup CTO, technical PM on multi-million-dollar R&D programs,
    and data/AI engineer.
  pm: >-
    Technical project manager and former startup CTO with a record of delivering
    R&D programs across government, industry, and academia — including an
    ~$8M ACOA Atlantic Innovation Fund program with GE Healthcare Canada.
    Hands-on technical background in Python, cloud, and data engineering, so I
    can manage engineers and also speak their language.
  teaching: >-
    Physicist (M.Sc. Physics, B.Sc. Astrophysics) with university teaching
    assistant and K–12 classroom experience, plus 20 years applying physics and
    computation in research and industry. I bring real-world examples from NASA
    balloon missions, accelerator experiments, and medical imaging AI.

