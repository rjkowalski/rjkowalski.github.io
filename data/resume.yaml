headlines:
  general: Data Engineer · AI Engineer · Technical Project Manager · Physicist
  data-eng: Data & AI Engineer — Python, Databricks, Medical Imaging Pipelines
  ai-training: Physicist & Python Engineer — M.Sc. Physics, 20+ years of scientific computing
