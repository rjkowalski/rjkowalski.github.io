# ---------------------------------------------------------------------------
# Master resume — single source of truth for rjkowalski.github.io and all
# tailored resumes. Merged from the 2016–2025 resume archive, cover letters,
# and the current website.
#
# Lanes (filter keys):
#   data-eng     data engineering / platform / cloud
#   ai-training  AI training & evaluation platforms (physics + Python expert)
#   space        space sector / instrumentation / systems integration
#   pm           technical project / product management, fractional leadership
#   teaching     university instruction, outreach
#   general      include everywhere
#
# Conventions:
#   tags: [...]      lanes a bullet/item belongs to
#   priority: 1-3    1 = always show when lane matches, 3 = only in long form
#   public: false    never render on the website (still usable in PDFs)
#   note: "..."      TODO/VERIFY for you; renderer must ignore it
#   status: draft    hide from output until reviewed
#   (YAML comments inside >- folded text become part of the text — use note:)
# ---------------------------------------------------------------------------

