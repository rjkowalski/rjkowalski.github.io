# Home page
home:
  employment: [nsh, iwk, bluelight, blackberry]
  infoblocks:
    - icon: fa-comments-o
      title: Communication
      text: >-
        Confident and adaptable, with strong oral, written, and presentation
        skills — comfortable explaining technical work to radiologists,
        executives, funders, and students.
    - icon: fa-users
      title: Leadership
      text: >-
        Former startup CTO and R&D program manager who builds productive teams
        by playing to individual strengths.
    - icon: fa-lightbulb-o
      title: Initiative
      text: >-
        Self-directed and hands-on — from soldering flight hardware in
        Antarctica to shipping data platforms in a hospital.
  skills:
    - icon: fa-database
      color: color33
      title: Data & AI Engineering
      text: >-
        Python for {python_years}+ years. ETL pipelines, Databricks, Docker, and
        MongoDB/PostgreSQL; DICOM de-identification and MONAI Label annotation
        tooling for medical imaging AI.
    - icon: fa-tasks
      color: color34
      title: Technical Project Management
      text: >-
        Former CTO and manager of an ~$8M R&D program with GE Healthcare
        Canada. Agile teams, budgets, grant reporting, and IP commercialization.
    - icon: fa-cogs
      color: color35
      title: Systems Integration
      text: >-
        Hardware, firmware, and RF integration for two NASA long-duration
        balloon flights (New Mexico and Antarctica) and accelerator experiments
        at SLAC.

about:
  subtitle: A short history of my academic and professional experience
  story:
    - >-
      I'm a data and AI engineer with a background in physics and astrophysics
      and more than 20 years of experience in technology research, development,
      and innovation across the private sector, government, research
      laboratories, and universities. I'm at my best on problems that mix
      systems integration, data, and scientific reasoning.
    - >-
      Today I build the data infrastructure behind machine-learning research in
      diagnostic imaging (MRI, CT, ultrasound) at Nova Scotia Health: ETL
      pipelines, DICOM de-identification tooling, and annotation platforms for
      radiologists. Before that, I managed innovation-focused imaging R&D at the
      IWK Health Centre, including an ~$8M program building AI-based MRI tools
      with GE Healthcare Canada.
    - >-
      Earlier, I was CTO of a dental-technology startup, leading the team behind
      a cloud-based (AWS) SaaS analytics product used across North America,
      South America, and Europe, and before that I built Python test-automation
      software at BlackBerry for products used by millions.
    - >-
      My research career took me from stellar evolution models at Saint Mary's
      to the ANITA neutrino experiment at the University of Hawai'i: accelerator
      experiments at SLAC and two NASA long-duration balloon campaigns, in New
      Mexico and Antarctica. Along the way I made the top 100 of the Canadian
      Space Agency's astronaut recruitment campaign.
  pitch: >-
    I believe teamwork and communication are the cornerstone of any
    organization's productivity. I bring problem-solving, data analysis, and the
    ability to communicate complex ideas clearly — to engineers, clinicians,
    executives, and students alike.
  facts:
    - {label: Nationality, text: Canadian}
    - {label: Languages, text: "English, French (basic)"}
    - {label: Education, text: "B.Sc. Astrophysics | M.Sc. Physics", url: education.html}
    - {label: Current Position, text: "Data & AI Engineer | Nova Scotia Health", url: experience.html}
    - {label: Industries of Interest, text: "Space, Health Technology, AI, Renewable Energy"}
    - {label: Specialities, text: "Data Engineering, Medical Imaging AI, Project Management, Systems Integration", url: skills.html}

